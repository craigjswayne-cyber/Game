<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#24478f" />
    <!-- Without this, Samsung Internet and Chrome for Android decide for
         themselves that a page declaring --paper: #ffffff is a light page and
         apply their own algorithmic dark mode ON TOP of night mode. That
         re-tints the night cards (now #222624 charcoal) to a flat mid-grey,
         which is why the game looked grey on the phone while every headless
         measurement in scripts/colouraudit.mjs read the real CSS. Saying the page
         handles both schemes itself turns force-dark off. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>PHASE: Rugby Manager</title>
    <!-- There was a beforeinstallprompt capture here, feeding an in-game Install
         button. It did not work on the phones this game is played on, so the
         button and the cue that carried it are gone (user: "the install to your
         device doesnt work, remove this from the game"). Adding the game to a
         home screen from the browser's own Share menu still works and the
         handbook still says so. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
