<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1a201e" />
    <!-- Without this, Samsung Internet and Chrome for Android decide for
         themselves that a page declaring --paper: #ffffff is a light page and
         apply their own algorithmic dark mode ON TOP of night mode. That
         re-tints the night cards (now #222624 charcoal) to a flat mid-grey,
         which is why the game looked grey on the phone while every headless
         measurement in scripts/colouraudit.mjs read the real CSS. Saying the page
         handles both schemes itself turns force-dark off. -->
    <meta name="color-scheme" content="dark light" />
    <!-- IMAGES COME FROM THE GAME ITSELF (1.8.18). A narrow policy on purpose:
         images only, CSS background images included. The game ships every
         picture it shows, so nothing here costs it anything; what it stops is
         a stranger's save file smuggling url(https://...) into a club colour
         and making the phone call out (security findings F3 and F4, fixed at
         the source in migrate() - this is the second lock). Scripts and styles
         are deliberately NOT restricted: the store shells inject the advert
         bridge as an inline script, and a broader policy would silently stop
         the adverts. Capacitor's own bridge is injected the same way on
         Android.
         EVERYTHING ELSE THAT CAN BE LOCKED, IS. The game never makes a request
         from the page (scripts/netprobe.ts polices that), so connect-src is
         'self' rather than 'none' only because Vite's dev server talks to its
         own origin (the HMR socket and its ping); a built game sends nothing
         either way, and the service worker's fetches answer to sw.js, not to
         this tag. The advert bridge needs none of these: the ad SDK draws natively
         over the web view and its requests leave from native code, and the
         plugin calls go through Capacitor's message bridge, not fetch. Fonts
         and sounds are the game's own (sounds are synthesised). There are no
         plugins, no forms and no reason for a base URL. frame-ancestors is
         left out because browsers ignore it in a meta tag. -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; media-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <title>PHASE: Rugby Manager</title>
    <!-- There was a beforeinstallprompt capture here, feeding an in-game Install
         button. It did not work on the phones this game is played on, so the
         button and the cue that carried it are gone (user: "the install to your
         device doesnt work, remove this from the game"). Adding the game to a
         home screen from the browser's own Share menu still works and the
         handbook still says so. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
