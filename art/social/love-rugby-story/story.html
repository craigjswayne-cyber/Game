<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'BSC';font-weight:700;src:url(../../../landing/barlow-semi-condensed-latin-700-normal.woff2)}
@font-face{font-family:'Barlow';font-weight:700;src:url(../../../landing/barlow-latin-700-normal.woff2)}
:root{--canvas:#1a201e;--text:#f0f4f2;--green:#34c06f;--gold:#e9be68}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--canvas)}
.post{position:relative;width:1080px;height:1920px;color:var(--text);font-family:'Barlow',sans-serif}
.bg{position:absolute;inset:0;background:url(../../../landing/img/hero.webp) center/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,12,10,.80) 0%,rgba(8,12,10,.78) 30%,rgba(8,12,10,.55) 55%,rgba(8,12,10,.80) 78%,rgba(8,12,10,.92) 100%)}
.k{position:absolute;left:65px;right:65px;text-align:center}
h1{top:294px;font-family:'BSC';font-size:150px;line-height:.92;text-shadow:0 4px 24px rgba(0,0,0,.7)}
h1 em{font-style:normal;color:var(--green)}
.sub{top:596px;font-family:'BSC';font-size:62px;line-height:1;color:var(--gold);text-shadow:0 3px 16px rgba(0,0,0,.8)}
.phone{position:absolute;left:50%;top:690px;width:340px;height:520px;margin-left:-170px;transform:rotate(-5deg);
 border-radius:60px;background:#111;padding:58px 16px 16px;overflow:hidden;
 box-shadow:0 0 0 3px #2a312e,0 40px 90px rgba(0,0,0,.75),0 0 140px rgba(52,192,111,.22)}
.phone::before{content:"";position:absolute;top:20px;left:50%;width:110px;height:28px;margin-left:-55px;border-radius:14px;background:#000}
.screen{width:100%;height:100%;border-radius:0 0 44px 44px;overflow:hidden}
.screen img{display:block;width:100%}
.brand{top:1248px;display:flex;justify-content:center}
.brand .row{display:inline-flex;align-items:center;gap:20px}
.brand img{width:82px;height:82px}
.brand span{text-align:left;font-family:'BSC';line-height:.9}
.brand b{display:block;font-size:80px;color:var(--green)}
.brand i{display:block;font-style:normal;font-size:35px}
.free{top:1368px;font-size:26px;letter-spacing:6px;text-transform:uppercase;color:var(--text)}
.stores{top:1420px;display:flex;gap:20px;justify-content:center}
.store{display:flex;align-items:center;gap:14px;flex:1;padding:16px 24px;border-radius:16px;background:var(--green);color:#070d0a;text-align:left;box-shadow:inset 0 2px rgba(255,255,255,.45)}
.store svg{width:48px;height:48px;flex:none}
.store .l1{display:block;font-size:19px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75}
.store .l2{display:block;font-size:38px;line-height:1.1}
/* safe-zone overlay, shown only with ?overlay */
.ov{display:none;position:absolute;inset:0;pointer-events:none;font:700 30px 'Barlow',sans-serif;color:#fff}
.overlay .ov{display:block}
.ov .z{position:absolute;left:0;right:0;background:rgba(220,40,40,.42);display:flex;align-items:center;justify-content:center;letter-spacing:2px}
.ov .t{top:0;height:270px}.ov .b{bottom:0;height:380px}
.ov .m{position:absolute;top:0;bottom:0;width:65px;background:rgba(220,40,40,.28)}
.ov .ml{left:0}.ov .mr{right:0}
.ov .line{position:absolute;left:0;right:0;border-top:3px dashed #fff}

<div class="bg"></div><div class="shade"></div>

</div>

</div><script>if(location.search.includes('overlay'))document.getElementById('post').classList.add('overlay')</script></body></html>
