<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'BSC';font-weight:700;src:url(../../../landing/barlow-semi-condensed-latin-700-normal.woff2)}
@font-face{font-family:'Barlow';font-weight:700;src:url(../../../landing/barlow-latin-700-normal.woff2)}
:root{--canvas:#1a201e;--text:#f0f4f2;--sec:#b3bdb9;--green:#34c06f;--gold:#e9be68;--on:#070d0a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden;background:var(--canvas)}
.post{position:relative;width:1080px;height:1440px;color:var(--text);font-family:'Barlow',sans-serif}
.bg{position:absolute;inset:0;background:url(../../../landing/img/hero.webp) center 60%/cover no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,12,10,.90) 0%,rgba(8,12,10,.72) 45%,rgba(8,12,10,.55) 60%,rgba(8,12,10,.92) 80%,var(--canvas) 100%)}
.top{position:absolute;top:150px;left:80px;right:80px;text-align:center}
h1{text-transform:uppercase;font-family:'BSC';font-size:220px;line-height:.9;text-shadow:0 4px 24px rgba(0,0,0,.7)}
h1 em{font-style:normal;color:var(--green);display:block}
.sub{text-transform:uppercase;margin-top:50px;font-family:'BSC';font-size:84px;line-height:1.02;color:var(--gold);text-shadow:0 3px 16px rgba(0,0,0,.8)}
.bottom{position:absolute;left:60px;right:60px;bottom:80px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:24px;margin-bottom:50px}
.brand img{width:120px;height:120px}
.brand span{text-align:left;font-family:'BSC';line-height:.9}
.brand b{display:block;font-size:120px;color:var(--green)}
.brand i{display:block;font-style:normal;font-size:52px}
.dl{font-size:29px;letter-spacing:4px;text-transform:uppercase;margin-bottom:20px}
.stores{display:flex;gap:20px;justify-content:center}
.store{display:flex;align-items:center;gap:16px;width:470px;padding:20px 28px;border-radius:16px;background:var(--green);color:var(--on);text-align:left;box-shadow:inset 0 2px rgba(255,255,255,.45)}
.store svg{width:52px;height:52px;flex:none}
.store .l1{display:block;font-size:21px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75}
.store .l2{display:block;font-size:40px;line-height:1.1}
</style></head><body><div class="post">
<div class="bg"></div><div class="shade"></div>
<div class="top">
  <h1>Love<em>rugby?</em></h1>
  <p class="sub">Rugby has a new<br>manager game.</p>
</div>
<div class="bottom">
  <div class="brand"><img src="../../../landing/img/icon.svg" alt=""><span><b>PHASE</b><i>Rugby Manager</i></span></div>
  <p class="dl">Download free on Apple &amp; Android</p>
  <div class="stores">
    <div class="store"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.2 1.8-3.3 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.5 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.6 2.2 2.7 2.2 1.1 0 1.5-.7 2.8-.7 1.3 0 1.6.7 2.8.7 1.2 0 1.9-1.1 2.6-2.1.8-1.2 1.2-2.4 1.2-2.4s-2.3-.9-2.3-3.4ZM14.3 6c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2Z"/></svg><span><span class="l1">Download on the</span><span class="l2">App Store</span></span></div>
    <div class="store"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 1.8a1.4 1.4 0 0 0-.5 1.1v18.2c0 .45.18.85.5 1.1l10-10.2-10-10.2Zm11.1 9.1 2.9-3-9.5-5.4 6.6 8.4Zm0 2.2-6.6 8.4 9.5-5.4-2.9-3Zm4.3-2.2-2.4-1.4-3 3.1 3 3.1 2.4-1.4c.9-.5.9-2.4 0-2.9v-.5Z"/></svg><span><span class="l1">Get it on</span><span class="l2">Google Play</span></span></div>
  </div>
</div>
</div></body></html>
