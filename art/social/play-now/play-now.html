<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'BSC';font-weight:700;src:url(../../../landing/barlow-semi-condensed-latin-700-normal.woff2)}
@font-face{font-family:'Barlow';font-weight:700;src:url(../../../landing/barlow-latin-700-normal.woff2)}
:root{--canvas:#0b100e;--green:#34c06f;--gold:#e9be68;--text:#f0f4f2;--on:#070d0a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden;background:var(--canvas)}
.post{position:relative;width:1080px;height:1440px;color:var(--text);font-family:'Barlow',sans-serif;
 background:radial-gradient(ellipse 70% 50% at 50% 38%,rgba(52,192,111,.22),transparent 70%),var(--canvas)}
canvas{position:absolute;inset:0}
.stage{position:absolute;left:0;right:0;top:40px;height:900px;perspective:2200px}
.phone{position:absolute;border-radius:62px;background:#111;padding:62px 16px 16px;
 box-shadow:0 0 0 3px #2a312e,0 40px 80px rgba(0,0,0,.7),0 0 120px rgba(52,192,111,.18)}
.phone img{display:block;width:100%;border-radius:0 0 46px 46px}
.phone::before{content:"";position:absolute;top:24px;left:50%;width:110px;height:28px;margin-left:-55px;border-radius:14px;background:#000;z-index:2}
.p1{width:390px;left:180px;top:30px;transform:rotateY(22deg) rotateZ(-8deg) rotateX(6deg);z-index:2}
.p2{width:320px;left:610px;top:140px;transform:rotateY(-14deg) rotateZ(7deg) rotateX(6deg);z-index:1;opacity:.96}
.logo{position:absolute;left:0;right:0;top:945px;text-align:center}
.logo .row{display:inline-flex;align-items:center;gap:26px}
.logo img{width:120px;height:120px}
.logo h1{font-family:'BSC';text-align:left;line-height:.9}
.logo h1 .b{display:block;font-size:150px;color:var(--green)}
.logo h1 .s{display:block;font-size:62px}
.play{position:absolute;left:50%;top:1172px;transform:translateX(-50%);font-family:'BSC';font-size:58px;letter-spacing:2px;padding:4px 40px;border:5px solid var(--text);border-radius:14px;text-transform:uppercase}
.strip{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--green);display:flex;align-items:center;justify-content:center;gap:24px}
.store{display:flex;align-items:center;gap:14px;padding:14px 26px;border-radius:14px;background:#070d0a;color:#fff;width:330px}
.store svg{width:44px;height:44px;flex:none}
.store .l1{display:block;font-size:16px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.store .l2{display:block;font-size:32px;line-height:1.1}
</style></head><body><div class="post">
<canvas id="c" width="1080" height="1440"></canvas>
<div class="stage">
  <div class="phone p2"><img src="screen-team.png" alt=""></div>
  <div class="phone p1"><img src="screen-home.png" alt=""></div>
</div>
<div class="logo"><div class="row"><img src="../../../landing/img/icon.svg" alt=""><h1><span class="b">PHASE</span><span class="s">Rugby Manager</span></h1></div></div>
<div class="play">Play now</div>
<div class="strip">
  <div class="store"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.7c0-2.2 1.8-3.3 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.5 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.6 2.2 2.7 2.2 1.1 0 1.5-.7 2.8-.7 1.3 0 1.6.7 2.8.7 1.2 0 1.9-1.1 2.6-2.1.8-1.2 1.2-2.4 1.2-2.4s-2.3-.9-2.3-3.4ZM14.3 6c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2Z"/></svg><span><span class="l1">Download on the</span><span class="l2">App Store</span></span></div>
  <div class="store"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 1.8a1.4 1.4 0 0 0-.5 1.1v18.2c0 .45.18.85.5 1.1l10-10.2-10-10.2Zm11.1 9.1 2.9-3-9.5-5.4 6.6 8.4Zm0 2.2-6.6 8.4 9.5-5.4-2.9-3Zm4.3-2.2-2.4-1.4-3 3.1 3 3.1 2.4-1.4c.9-.5.9-2.4 0-2.9v-.5Z"/></svg><span><span class="l1">Get it on</span><span class="l2">Google Play</span></span></div>
</div>
</div>
<script>
// seeded so every render is identical
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const c=document.getElementById('c').getContext('2d');
for(let i=0;i<1400;i++){const x=r()*1080,y=r()*1300;const d=Math.hypot((x-540)/540,(y-520)/560);if(r()<d*.9)continue;
 const a=(1-Math.min(d,1))*.9*r()+.08,z=r()*3+.6;c.fillStyle=r()<.18?`rgba(233,190,104,${a})`:`rgba(78,216,140,${a})`;c.beginPath();c.arc(x,y,z,0,7);c.fill()}
</script>
</body></html>
