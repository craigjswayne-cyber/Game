<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>PHASE: Rugby Manager - trailer</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/bass.js"></script>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/space-grotesk-latin.woff2") format("woff2");
        font-weight: 300 700;
      }
      :root {
        --canvas: #1a201e;
        --text: #f0f4f2;
        --text-2: #b3bdb9;
        --green: #34c06f;
        --green-hi: #4ed88c;
        --gold: #e9be68;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font-family: "Space Grotesk", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--canvas);
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .bg-art {
        position: absolute;
        inset: 0;
        background: url("assets/img/title-bg.webp") center / cover no-repeat;
      }
      .bg-veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(90% 60% at 50% 40%, rgba(26, 32, 30, 0.55), rgba(10, 13, 12, 0.94));
      }
      .glow {
        position: absolute;
        left: 90px;
        top: 260px;
        width: 900px;
        height: 1100px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(52, 192, 111, 0.55), rgba(52, 192, 111, 0));
        opacity: 0.5;
      }
      .center-stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .slam {
        display: block;
        font-weight: 700;
        font-size: 124px;
        line-height: 1;
        letter-spacing: -2px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .slam.green {
        color: var(--green);
      }
      /* the phone: a 0.6x window onto a real 1080x1920 screen */
      .phone {
        position: absolute;
        left: 204px;
        top: 150px;
        width: 672px;
        height: 1176px;
        border-radius: 64px;
        background: #0b0e0d;
        box-shadow: 0 0 0 3px #384240;
      }
      .screen {
        position: absolute;
        left: 12px;
        top: 12px;
        width: 648px;
        height: 1152px;
        border-radius: 52px;
        overflow: hidden;
        background: var(--canvas);
      }
      .screen img {
        position: absolute;
        left: 0;
        top: 0;
        width: 648px;
        height: 1152px;
        display: block;
      }
      .caption {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1430px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .cap {
        display: block;
        font-weight: 700;
        font-size: 96px;
        line-height: 1;
        letter-spacing: -1px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .cap.green {
        color: var(--green);
      }
      .ring {
        position: absolute;
        left: 8px;
        top: 324px;
        width: 630px;
        height: 92px;
        border-radius: 14px;
        box-shadow: 0 0 0 5px var(--green-hi), 0 0 40px 8px rgba(78, 216, 140, 0.6);
        opacity: 0;
      }
      .stats {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .stat {
        display: block;
        font-weight: 700;
        font-size: 84px;
        line-height: 1;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .stat b {
        color: var(--gold);
      }
      .stat.small {
        font-size: 60px;
        color: var(--text-2);
      }
      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .icon {
        display: block;
        width: 260px;
        height: 260px;
        margin-bottom: 56px;
      }
      .wordmark {
        display: block;
        font-weight: 700;
        font-size: 210px;
        line-height: 0.95;
        letter-spacing: -4px;
        color: var(--green);
      }
      .sub {
        display: block;
        font-weight: 700;
        font-size: 92px;
        line-height: 1;
        letter-spacing: 2px;
        margin-top: 12px;
      }
      .tagline {
        display: block;
        font-weight: 500;
        font-size: 54px;
        line-height: 1.2;
        margin-top: 80px;
        color: var(--text);
      }
      .foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .url {
        display: block;
        font-size: 44px;
        font-weight: 600;
        color: var(--gold);
      }
      .fine {
        display: block;
        font-size: 30px;
        color: var(--text-2);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="20.5" data-fps="30">
      <!-- Scene 1: hook -->
      <section id="s1" class="clip" data-start="0" data-duration="3.8" data-track-index="0">
        <div id="s1-art" class="bg-art" data-layout-allow-overflow></div>
        <div class="bg-veil"></div>
        <div id="s1-stack" class="center-stack">
          <span id="h1" class="slam">Your club.</span>
          <span id="h2" class="slam">Your legacy.</span>
          <span id="h3" class="slam green">Your time.</span>
        </div>
      </section>

      <!-- Scene 2: the week -->
      <section id="s2" class="clip" data-start="3.8" data-duration="4.94" data-track-index="0">
        <div id="s2-glow" class="glow"></div>
        <div id="s2-phone" class="phone">
          <div class="screen">
            <img id="s2-home" src="assets/img/2-home.png" alt="" />
            <img id="s2-squad" data-layout-allow-overflow src="assets/img/4-squad.png" alt="" />
          </div>
        </div>
        <div class="caption">
          <span id="c1" class="cap">Pick the XV.</span>
          <span id="c2" class="cap green">And live with it.</span>
        </div>
      </section>

      <!-- Scene 3: Saturday -->
      <section id="s3" class="clip" data-start="8.74" data-duration="4.37" data-track-index="0">
        <div id="s3-glow" class="glow"></div>
        <div id="s3-title" class="center-stack">
          <span id="sat1" class="slam" style="font-size: 150px">Then</span>
          <span id="sat2" class="slam green" style="font-size: 190px">Saturday.</span>
        </div>
        <div id="s3-phone" class="phone" data-layout-allow-overflow>
          <div id="s3-screen" class="screen">
            <img src="assets/img/6-match.png" alt="" />
            <div id="s3-ring" class="ring"></div>
          </div>
        </div>
        <div id="s3-cap" class="caption">
          <span class="cap">The calls</span>
          <span class="cap green">are yours.</span>
        </div>
      </section>

      <!-- Scene 4: full time -->
      <section id="s4" class="clip" data-start="13.11" data-duration="4.36" data-track-index="0">
        <div id="s4-glow" class="glow"></div>
        <div id="s4-phone" class="phone">
          <div class="screen">
            <img src="assets/img/7-fulltime.png" alt="" />
          </div>
        </div>
        <div class="stats">
          <span id="st1" class="stat"><b>171</b> clubs</span>
          <span id="st2" class="stat"><b>15</b> leagues</span>
          <span id="st3" class="stat small">Men's and women's game</span>
        </div>
      </section>

      <!-- Scene 5: outro -->
      <section id="s5" class="clip" data-start="17.47" data-duration="3.03" data-track-index="0">
        <div id="s5-art" class="bg-art" data-layout-allow-overflow></div>
        <div class="bg-veil"></div>
        <div class="lockup">
          <img id="logo-icon" class="icon" src="assets/img/icon.svg" alt="" />
          <span id="wm" class="wordmark">PHASE</span>
          <span id="sub" class="sub">RUGBY MANAGER</span>
          <span id="tag" class="tagline">Build something worth remembering.</span>
        </div>
        <div id="foot" class="foot">
          <span class="url">phaserugbymanager.com</span>
          <span class="fine">Unofficial and independent</span>
        </div>
      </section>

      <!-- audio -->
      <audio id="bg-music" data-start="0" data-duration="20.5" data-track-index="10" data-volume="0.38" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":19.2,"v":1},{"t":20.45,"v":0}]}]}' src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-h1" data-start="0.54" data-duration="0.18" data-track-index="11" data-volume="0.75" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-h2" data-start="1.62" data-duration="0.15" data-track-index="12" data-volume="0.75" src="assets/sfx/impact/impactSoft_medium_004.ogg"></audio>
      <audio id="sfx-h3" data-start="2.71" data-duration="0.18" data-track-index="13" data-volume="0.85" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-ph1" data-start="3.8" data-duration="0.6" data-track-index="14" data-volume="0.6" src="assets/sfx/casino/card-slide-1.ogg"></audio>
      <audio id="sfx-ph2" data-start="6.0" data-duration="0.6" data-track-index="15" data-volume="0.6" src="assets/sfx/casino/card-slide-1.ogg"></audio>
      <audio id="sfx-sat" data-start="8.72" data-duration="0.54" data-track-index="16" data-volume="0.9" src="assets/sfx/impact/impactSoft_heavy_003.ogg"></audio>
      <audio id="sfx-ph3" data-start="10.35" data-duration="0.6" data-track-index="17" data-volume="0.6" src="assets/sfx/casino/card-slide-1.ogg"></audio>
      <audio id="sfx-ft" data-start="13.09" data-duration="0.15" data-track-index="18" data-volume="0.8" src="assets/sfx/impact/impactSoft_medium_004.ogg"></audio>
      <audio id="sfx-st1" data-start="13.64" data-duration="0.01" data-track-index="19" data-volume="0.6" src="assets/sfx/interface/click_003.ogg"></audio>
      <audio id="sfx-st2" data-start="14.73" data-duration="0.01" data-track-index="20" data-volume="0.6" src="assets/sfx/interface/click_003.ogg"></audio>
      <audio id="sfx-st3" data-start="15.84" data-duration="0.01" data-track-index="21" data-volume="0.6" src="assets/sfx/interface/click_003.ogg"></audio>
      <audio id="sfx-logo" data-start="17.45" data-duration="1.48" data-track-index="22" data-volume="0.8" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const slamIn = { scale: 1.6, opacity: 0, filter: "blur(12px)" };
      const slamTo = { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "power4.out" };

      // ---- Scene 1: hook (beat-grid: 0.56, 1.64, 2.73; every other beat so each line reads)
      tl.fromTo("#s1-art", { scale: 1.12 }, { scale: 1.0, duration: 3.8, ease: "none" }, 0);
      tl.fromTo("#h1", slamIn, slamTo, 0.56);
      tl.fromTo("#h2", slamIn, slamTo, 1.64);
      tl.fromTo("#h3", slamIn, slamTo, 2.73);
      tl.to("#s1-stack", { scale: 1.25, opacity: 0, duration: 0.25, ease: "power2.in" }, 3.52);

      // ---- Scene 2: the week
      tl.fromTo("#s2-phone", { y: 700, rotation: -4 }, { y: 0, rotation: 0, duration: 0.6, ease: "power3.out" }, 3.8);
      tl.fromTo("#c1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 4.39);
      tl.fromTo("#s2-squad", { xPercent: 100 }, { xPercent: 0, duration: 0.45, ease: "power3.inOut" }, 6.0);
      tl.fromTo("#s2-squad", { scale: 1 }, { scale: 1.08, duration: 2.2, ease: "none" }, 6.45);
      tl.fromTo("#c2", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 6.56);
      tl.to("#s2-phone", { y: -40, duration: 4.9, ease: "none" }, 3.8 + 0.6);

      // ---- Scene 3: Saturday
      // beat-locked: 8.74s (strong cue)
      tl.fromTo("#sat1", slamIn, slamTo, 8.74);
      tl.fromTo("#sat2", { scale: 2.2, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, 8.84);
      tl.to("#s3-title", { scale: 0.85, opacity: 0, duration: 0.3, ease: "power2.in" }, 10.1);
      tl.fromTo("#s3-phone", { y: 1900 }, { y: 0, duration: 0.55, ease: "power3.out" }, 10.37);
      tl.fromTo("#s3-cap", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 10.6);
      tl.fromTo("#s3-ring", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 11.0);
      tl.fromTo("#s3-phone", { scale: 1 }, { scale: 1.06, duration: 2.0, ease: "power1.inOut" }, 11.0);

      // ---- Scene 4: full time
      // beat-locked: 13.11s (strong cue)
      tl.fromTo("#s4-phone", { scale: 1.3, opacity: 0 }, { scale: 0.92, opacity: 1, duration: 0.4, ease: "power4.out" }, 13.11);
      tl.to("#s4-phone", { y: -40, duration: 3.8, ease: "none" }, 13.51);
      // beat-grid: stat 1 at 13.64s, stat 2 at 14.73s, stat 3 at 15.84s (every other beat, held to scene end)
      tl.fromTo("#st1", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 13.64);
      tl.fromTo("#st2", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 14.73);
      tl.fromTo("#st3", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 15.84);

      // ---- Scene 5: outro
      // beat-locked: 17.47s (strong cue)
      tl.fromTo("#s5-art", { scale: 1.0 }, { scale: 1.1, duration: 3.03, ease: "none" }, 17.47);
      tl.fromTo("#logo-icon", { scale: 0.3, rotation: -40, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 17.47);
      tl.fromTo("#wm", slamIn, slamTo, 17.55);
      tl.fromTo("#sub", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 17.8);
      // beat-locked: 18.56s
      tl.fromTo("#tag", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 18.56);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 19.1);

      // ---- audio-reactive: the floodlight glow behind the phone breathes with the bass
      const glows = ["#s2-glow", "#s3-glow", "#s4-glow"].map((s) => document.querySelector(s));
      const bass = window.BASS || [];
      for (let f = 0; f < bass.length; f++) {
        tl.call(
          (function (v) {
            return function () {
              for (const g of glows) {
                g.style.opacity = String(0.3 + 0.55 * v);
                g.style.transform = "scale(" + (0.94 + 0.12 * v) + ")";
              }
            };
          })(bass[f]),
          [],
          f / 30,
        );
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
