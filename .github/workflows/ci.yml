name: Gate

# WHAT RUNS THE PROBES.
#
# There are 110-odd harnesses in scripts/ and until now nothing ran them
# automatically: the only workflow in this repo built the game and deployed it
# to players, so a push to main shipped whatever it was given. Every gate this
# project has passed was passed because somebody remembered to type
# ./scripts/suite.sh - and the one time that habit slipped, a rename broke 42
# browser harnesses and the engine-only run reported green for a fortnight.
#
# Four jobs, because they cost different amounts of time:
#
#   engine      ~35 min a shard, on every push and every PR. This is the one
#               that must be green before anything merges. Shard 1 also runs
#               the vitest unit tests (npm test).
#   smoke       ~6 min plus Chromium, on pull requests and pushes to branches other
#               than main: four browser harnesses (suite.sh smoke), so a PR
#               that breaks the wizard or the till hears about it before it
#               merges, not after.
#   browser-pr  the same triggers: 25 more browser harnesses (suite.sh pr) in
#               three shards, chosen for what a player loses most by.
#   browser     ~40 min a shard, on main and once a night. It needs a build, a
#               preview server and Chromium, and it is the half that catches
#               what the engine cannot see - tap targets, contrast, overflow.
#
# The soaks (suite.sh soak) run weekly in soak.yml; release-check.yml runs the
# soaks and the whole browser list on one ref before a release is cut. The
# Pages deploy (pages.yml) waits for this workflow to pass on main.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # 03:00 UTC, so a flake that only shows under load has somewhere to show
    - cron: '0 3 * * *'
  workflow_dispatch:

# the gate only reads the repository; upload-artifact uses the runtime token,
# not GITHUB_TOKEN, so no job needs more than this
permissions:
  contents: read

# a second push to the same branch cancels the first: nobody needs the gate on
# a commit that has already been replaced
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine probes (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    # 55 MINUTES (1.8.11). Shard 2 ran 40m16s and was cancelled at the 40-minute
    # cap twice on 6 Oct (runs 37383214771, 37389756605) after new probes moved
    # the round-robin; it passes locally. Headroom rather than a ninth shard.
    timeout-minutes: 55
    # TWO SHARDS (v1.2.2). The engine suite crossed the thirty-minute ceiling
    # on 1 Sept (run 33558333319, cancelled at 29m37s). dialweight moved to the
    # release-only list and frliveprobe gained a quick mode; the rest is split
    # in two so a probe added tomorrow does not put the Gate back on the edge.
    # FOUR SHARDS (1.8.0). The probes grew bigger samples so their verdicts
    # stop flipping with the seed, and both shards of two crossed thirty
    # minutes again (run 36465738222: shard 1 cancelled at 30m with every
    # probe it had reached passing, a handful from the end). Four halves the
    # load, and forty minutes leaves room for a slow runner.
    # EIGHT SHARDS (1.8.5). Seven new probes (the causal loop, world memory,
    # job fit, rival bids and the trust fixes) moved the round robin again and
    # shard 6 ran past its 40 minutes twice (runs 37257399221, 37260212263)
    # while the rest finished in 25 to 35: two more shards, same ceiling.
    # SIX SHARDS (1.8.3). Five new probes moved every file one place along the
    # round robin, and shard 2 landed analystprobe and frliveprobe together:
    # cancelled at forty minutes on both runs of PR 22 while the other three
    # finished in twenty to thirty-one. Six spreads the heavy ones again.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the three linters first: they take seconds and they fail for reasons
      # that are quick to read
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: House style
        run: npx vite-node scripts/textlint.ts
      - name: Design tokens
        run: npx vite-node scripts/tokenlint.ts
      - name: Stylesheet
        run: node scripts/cssaudit.mjs
      - name: Accessibility lint
        run: npm run lint
      # every harness in scripts/ is in a suite list or named as a tool: a
      # probe nobody lists is a probe nobody runs (1.9.1)
      - name: Orphan check
        run: node scripts/orphancheck.mjs
      # the vitest unit project: fingerprint, migrations, refunds and a short
      # determinism check, in about a minute. Once, not eight times.
      - name: Unit tests
        if: matrix.shard == 1
        run: npm test
      # the IP tripwire needs a build, but it is 20 seconds and it guards the
      # thing that would pull the game from a store rather than break a career
      - name: Build
        run: npm run build
      - name: Real-world marks
        run: node scripts/ipprobe.mjs
      - name: Engine suite
        env:
          SHARDS: 8
          SHARD: ${{ matrix.shard }}
          PROBE_QUICK: 1
        run: bash scripts/suite.sh fast

  smoke:
    name: Browser smoke (PR)
    # the browser job below is main and nightly only; this is the small part of
    # it a pull request can afford: e2e, storeprobe, backupreach, keyscreen
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # pinned to playwright-core's own version: see the browser job
      - name: Install Chromium
        run: npx "playwright@$(node -p "require('playwright-core/package.json').version")" install --with-deps chromium
      - name: Locate Chromium
        run: echo "PW_CHROMIUM=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Browser smoke
        run: bash scripts/suite.sh smoke
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-smoke
          path: |
            shots/
            shots-*/
          if-no-files-found: ignore
          retention-days: 7

  # THE SECOND PR JOB (1.9.2). Smoke is four harnesses; the full list is 102
  # and about forty minutes a shard, too long for every pull request. This
  # runs the 25 in PRBROWSER (scripts/suite.sh): accessibility, save and load,
  # purchases, the match screen and the phone layout, three shards of eight
  # or nine. Same triggers as smoke.
  browser-pr:
    name: Browser, PR set (shard ${{ matrix.bshard }} of 3)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        bshard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # pinned to playwright-core's own version: see the browser job
      - name: Install Chromium
        run: npx "playwright@$(node -p "require('playwright-core/package.json').version")" install --with-deps chromium
      - name: Locate Chromium
        run: echo "PW_CHROMIUM=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Browser, PR set
        env:
          BSHARDS: 3
          BSHARD: ${{ matrix.bshard }}
        run: bash scripts/suite.sh pr
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-pr-${{ matrix.bshard }}
          path: |
            shots/
            shots-*/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser harnesses (shard ${{ matrix.bshard }} of 3)
    # only where it is worth 40 minutes: the branch that deploys, and overnight
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # THREE SHARDS, BROWSER ONLY (1.8.4). This job ran `suite.sh`, which runs
    # every engine probe unsharded before the first harness: it was cancelled
    # at 75 minutes on every merge to main since 1.8.2 without reaching one.
    # The engine is the engine job's; this runs `suite.sh browser`, split three
    # ways over 67 harnesses.
    strategy:
      fail-fast: false
      matrix:
        bshard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the probes launch playwright-core against a browser they are TOLD about
      # (PW_CHROMIUM), because the path differs between a dev container and a
      # runner. Install it here and point them at it.
      # PINNED TO playwright-core's OWN VERSION. `npx playwright install` with no
      # version fetches the newest playwright on npm and downloads the Chromium
      # build THAT version wants; playwright-core in package-lock.json asks for
      # the build ITS version wants. The two agreed until 1.63.0 shipped
      # overnight on 5 Sep 2026: the runner then held build 1243, the probes
      # asked for 1234, and all 49 browser harnesses crashed at launch on a
      # commit that had passed the same job the evening before.
      - name: Install Chromium
        run: npx "playwright@$(node -p "require('playwright-core/package.json').version")" install --with-deps chromium
      - name: Locate Chromium
        run: echo "PW_CHROMIUM=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Browser harnesses
        env:
          BSHARDS: 3
          BSHARD: ${{ matrix.bshard }}
        run: bash scripts/suite.sh browser
      # a failed browser run is worth looking at, and a screenshot says more
      # than the line that failed
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-${{ matrix.bshard }}
          path: |
            shots/
            shots-*/
          if-no-files-found: ignore
          retention-days: 7
