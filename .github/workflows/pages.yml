name: Deploy to GitHub Pages

# Only main deploys — the github-pages environment rejects other branches,
# so feature-branch runs would just fail noisily in seconds.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # WHAT GOES LIVE IS CHECKED, AND NOTHING ELSE. This step used to run the
      # whole engine suite (suite.sh fast) in one job, about three hours a
      # deploy, from when the site WAS the game. The game is no longer published
      # (see below): the site is landing/ and public/, and the engine suite
      # already runs on every pull request in Gate (ci.yml), split eight ways,
      # before anything reaches main. So the deploy checks the page it ships
      # (landingprobe) and still builds and marks-checks dist/ for the shells.
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Landing page
        run: npx vite-node scripts/landingprobe.ts
      - run: npm run build
      # nothing with a real club, competition or sponsor mark in it gets published
      - name: Real-world marks
        run: node scripts/ipprobe.mjs
      # ---- THE SITE IS NOT THE APP, AND NO LONGER CONTAINS IT ----
      #
      # This used to publish dist/ as the whole website, so phaserugbymanager.com
      # opened straight into a playable game. Two changes since, both the owner's:
      # first the root became a landing page with the game moved to /play/, then
      # "i dont want people to be able to play in browser" - so the game is not
      # published to the web at all any more.
      #
      # That is why THE BUILD ABOVE STILL RUNS. dist/ is not the website; it is
      # what the iOS and Android shells bundle, and ipprobe reads it to check no
      # real-world mark ships. Building it and then not publishing it looks
      # wasteful and is not: it is the artefact every other check is about.
      #
      # THREE THINGS MUST BE AT THE ROOT and all three live in public/, so
      # copying public/ covers them even if a fourth is added later:
      #   privacy.html   - the policy URL submitted to Apple AND Google
      #   google...html  - Search Console verifies the ROOT specifically
      #   CNAME          - or the custom domain stops resolving
      - name: Assemble the site (landing page only, no game)
        run: |
          rm -rf site && mkdir -p site
          cp -R public/. site/
          cp -R landing/. site/
          test -f site/index.html
          test -f site/privacy.html
          test -f site/CNAME
          test -f site/google59479af58f8cd344.html
          test -f site/app-ads.txt
          grep -q 'Rugby Manager' site/index.html
          # the game must NOT be here. A stray index at any depth below the root
          # would be a playable build nobody meant to publish.
          if [ -e site/play ]; then echo "site/play exists - the game is being published again"; exit 1; fi
          if grep -q 'src="./assets/' site/index.html; then echo "the landing page is booting the app"; exit 1; fi
          echo "site assembled:" && ls site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
